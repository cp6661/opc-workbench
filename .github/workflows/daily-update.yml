name: 工作台每日更新

on:
  schedule:
    # 时间一律用 UTC：UTC 23:30 = 北京时间次日 07:30
    - cron: '30 23 * * *'
    # 兜底重跑：GitHub 定时任务高峰期可能延迟 15~40 分钟，再补一次
    - cron: '45 23 * * *'
  workflow_dispatch: {}

env:
  # runner 默认 UTC，统一改成北京时间，避免 commit 日志和日期对不上
  TZ: Asia/Shanghai

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成当日资讯
        run: |
          python3 sync_data.py
          touch .nojekyll
          echo "更新时间：$(date '+%Y-%m-%d %H:%M:%S')"

      - name: 回写当日数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "每日更新 $(date '+%Y-%m-%d')"
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
