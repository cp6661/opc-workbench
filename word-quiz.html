<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词循环猜</title>
<style>
:root {
  --bg: #f5f6fa;
  --card: #ffffff;
  --text: #1f2330;
  --muted: #8a90a3;
  --primary: #4f6ef7;
  --primary-soft: #eef1fe;
  --ok: #2fbf71;
  --err: #f25f5c;
  --warn: #f5a623;
  --radius: 16px;
  --shadow: 0 4px 16px rgba(31,35,48,.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 560px; margin: 0 auto; min-height: 100vh;
  display: flex; flex-direction: column;
}
header { padding: 18px 16px 8px; text-align: center; }
header h1 { font-size: 20px; }
.stats { display:flex; justify-content:center; gap:12px; margin-top:6px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
.stats b { color: var(--primary); }

/* 模式选择 */
.mode-select { padding: 18px 16px; display:flex; flex-direction:column; gap:12px; flex:1; justify-content:center; }
.btn {
  border:none; border-radius: var(--radius); padding: 16px;
  font-size: 17px; font-weight: 600; cursor:pointer;
  background: var(--card); color: var(--text); box-shadow: var(--shadow);
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color:#fff; }
.btn.warn { background:#fff7ea; color:#b97b12; }
.btn small { display:block; font-weight:400; font-size:12px; margin-top:4px; opacity:.7; }

/* 答题区 */
.quiz { flex:1; display:flex; flex-direction:column; padding: 14px; gap:12px; }
.progress-bar { height:6px; background:#e8eaf1; border-radius:3px; overflow:hidden; }
.progress-bar i { display:block; height:100%; background:var(--primary); border-radius:3px; transition: width .3s; }
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 32px 20px; text-align:center; flex:1;
  display:flex; flex-direction:column; justify-content:center; gap:8px;
}
.card .tag { font-size:12px; color:var(--muted); letter-spacing:2px; }
.card .word { font-size:32px; font-weight:700; word-break:break-all; }
.card .word.zh { font-size:26px; }
.answer-row { display:flex; gap:10px; }
#answerInput {
  flex:1; border:2px solid #e8eaf1; border-radius:12px; padding:14px;
  font-size:16px; outline:none; background:var(--card); color:var(--text);
  transition: border-color .15s;
}
#answerInput:focus { border-color:var(--primary); }
#answerInput.ok { border-color:var(--ok); background:#eafaf1; }
#answerInput.err { border-color:var(--err); background:#feeeee; }
#submitBtn { padding:14px 20px; font-size:16px; }
.feedback { text-align:center; font-size:14px; min-height:20px; font-weight:600; }
.feedback.ok { color:var(--ok); }
.feedback.err { color:var(--err); }
.feedback.skip { color:var(--warn); }
.answer-reveal {
  text-align:center; font-size:15px; font-weight:700; min-height:22px;
  color:var(--text); word-break:break-all;
}
.answer-reveal .zh { color:var(--muted); font-weight:500; }
.bottom-btns { display:flex; gap:10px; padding: 0 16px 16px; }
.bottom-btns .btn { flex:1; padding:12px; font-size:14px; }

/* 结束页 */
.done { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
.done .big { font-size:56px; }
.done p { color:var(--muted); text-align:center; }
.done .warn-note { color:#b97b12; font-size:14px; text-align:center; }
.hidden { display:none !important; }
</style>
</head>
<body>

<!-- 首页 -->
<div id="home">
  <header>
    <h1>📚 单词循环猜</h1>
    <div class="stats">
      <span>词库 <b id="totalWords">0</b> 词</span>
      <span>每组 <b id="sessionSizeTxt">45</b> 题</span>
      <span>待复习 <b id="reviewLen">0</b></span>
    </div>
  </header>
  <div class="mode-select">
    <button class="btn warn hidden" id="continueBtn" onclick="resume()">▶ 继续上次进度<small id="continueTxt"></small></button>
    <button class="btn primary" onclick="start('e2c')">英译汉 🇬🇧→🇨🇳<small>看英文，写中文意思（随机 45 词一组）</small></button>
    <button class="btn primary" onclick="start('c2e')">汉译英 🇨🇳→🇬🇧<small>看中文，写英文单词（随机 45 词一组）</small></button>
    <button class="btn" onclick="start('mixed')">混合模式 🔄<small>两种随机交替，错了隔几题再考</small></button>
  </div>
</div>

<!-- 答题页 -->
<div id="quiz" class="hidden">
  <div class="quiz">
    <div class="progress-bar"><i id="bar"></i></div>
    <div class="card">
      <div class="tag" id="qTag">写出正确意思</div>
      <div class="word" id="qWord">word</div>
    </div>
    <div class="answer-reveal" id="reveal"></div>
    <div class="answer-row">
      <input id="answerInput" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="输入答案…" disabled>
      <button class="btn primary" id="submitBtn" onclick="submitAnswer()">提交</button>
    </div>
    <div style="padding:0 0 2px">
      <button class="btn" id="skipBtn" onclick="dontKnow()">🙋 不认识，下次再记</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="bottom-btns">
    <button class="btn" onclick="quitQuiz()">暂停退出（进度已保存）</button>
    <button class="btn primary hidden" id="nextBtn" onclick="next()">下一题</button>
  </div>
</div>

<!-- 结束页 -->
<div id="done" class="hidden">
  <div class="done">
    <div class="big">🎉</div>
    <h2>本组完成！</h2>
    <p id="doneStats"></p>
    <p class="warn-note" id="reviewNote"></p>
    <button class="btn primary" onclick="goHome()">返回首页</button>
  </div>
</div>

  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];

  return a;
};

function saveState(){
  try {
    localStorage.setItem(LS_SESSION, JSON.stringify({
      mode, queue: queue.map(w => w.en), tries: totalTries, wrong: totalWrong, size: sessionSize
    }));
  } catch(e){}
}
function clearState(){
  try { localStorage.removeItem(LS_SESSION); } catch(e){}
}
function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_SESSION));
    if (!s || !Array.isArray(s.queue) || !s.queue.length) return null;
    const q = s.queue.map(en => byEn[en.toLowerCase()]).filter(Boolean);
    if (!q.length) return null;
    return { mode: s.mode || 'mixed', queue: q, tries: s.tries || 0, wrong: s.wrong || 0, size: s.size || q.length };
  } catch(e){ return null; }
}

/* ===== 流程 ===== */
function start(m){
  mode = m;
  totalTries = 0; totalWrong = 0;
  // 一组 45 词：优先带上「待复习」的词，其余从词库随机补齐，整体打乱
  const session = [];
  reviewPool.forEach(en => { const w = byEn[en.toLowerCase()]; if (w && !session.includes(w)) session.push(w); });
  const rest = shuffle(WORDS.filter(w => !session.includes(w)));
  while (session.length < SESSION_SIZE && rest.length) session.push(rest.pop());
  queue = shuffle(session);
  sessionSize = queue.length;
  saveReview();
  $("home").classList.add("hidden");
  $("done").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  saveState();
  next();
}

function resume(){
  const s = loadState();
  if (!s) { goHome(); return; }
  mode = s.mode; queue = s.queue;
  totalTries = s.tries; totalWrong = s.wrong; sessionSize = s.size;
  $("home").classList.add("hidden");
  $("done").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  next();
}

function makeQuestion(item){
  let m = mode;
  if (mode === "mixed") m = Math.random() < .5 ? "e2c" : "c2e";
  return { item, askEn: m === "e2c" };
}

function next(){
  $("nextBtn").classList.add("hidden");
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("reveal").textContent = "";
  if (!queue.length) { finish(); return; }
  current = makeQuestion(queue[0]);
  const { item, askEn } = current;
  $("qTag").textContent = askEn ? "英译汉 · 写出中文意思" : "汉译英 · 写出英文单词";
  const q = $("qWord");
  q.textContent = askEn ? item.en : item.zh;
  q.className = askEn ? "word" : "word zh";
  const input = $("answerInput");
  input.value = "";
  input.disabled = false;
  input.className = "";
  input.placeholder = askEn ? "输入中文意思…" : "输入英文单词…";
  updateBar();
  setTimeout(() => input.focus(), 50);
}

// 中文答案：按常见分隔符拆成多个可接受答案
function zhAlternatives(zh) {
  return zh.split(/[;；、，,\/\s]+/).map(s => s.trim()).filter(Boolean);
}
// 归一化：去空格、去词性标注、转小写
function normalize(s) {
  return s.trim().toLowerCase().replace(/^(n|v|vt|vi|adj|adv|prep|conj|pron|art|num|interj)\.\s*/g, "").replace(/\s+/g, "");
}

function isCorrect(input) {
  const { item, askEn } = current;
  const norm = normalize(input);
  if (!norm) return false;
  if (askEn) {
    return zhAlternatives(item.zh).some(z => normalize(z) === norm);
  } else {
    return normalize(item.en) === norm;
  }
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// 无论对错，都展示「单词 + 意思」
function revealAnswer(prefix, cls) {
  const { item } = current;
  $("feedback").textContent = prefix;
  $("feedback").className = "feedback " + cls;
  $("reveal").innerHTML = esc(item.en) + ' <span class="zh">：' + esc(item.zh) + '</span>';
}

function submitAnswer() {
  const input = $("answerInput");
  if (input.disabled) return; // 已提交，等待下一题
  const val = input.value.trim();
  if (!val) {
    $("feedback").textContent = "先写下答案，或点「不认识」跳过";
    $("feedback").className = "feedback err";
    input.focus();
    return;
  }
  totalTries++;
  const right = isCorrect(val);
  input.disabled = true;
  input.className = right ? "ok" : "err";
  if (right) {
    queue.shift(); // 答对，移出队列
    // 答对了就从「待复习」里毕业
    const en = current.item.en.toLowerCase();
    if (reviewPool.includes(en)) {
      reviewPool = reviewPool.filter(x => x !== en);
      saveReview();
    }
    revealAnswer("✅ 答对了！", "ok");
  } else {
    totalWrong++;
    const item = queue.shift();
    // 错了：隔 3~5 题之后重新出现
    if (queue.length) {
      const gap = 3 + Math.floor(Math.random() * 3);
      queue.splice(Math.min(gap, queue.length), 0, item);
    } else {
      queue.push(item);
    }
    revealAnswer("❌ 错了，一会儿还会再考你", "err");
    input.value = current.item.en;
  }
  saveState();
  updateBar();
  $("nextBtn").classList.remove("hidden");
}

// 「不认识」：跳过本次，标记进待复习池，下次一组题优先考
function dontKnow() {
  const input = $("answerInput");
  if (input.disabled) return; // 已提交后不可用
  if (!queue.length) return;
  const item = queue.shift();
  current = { item, askEn: current ? current.askEn : true };
  const en = item.en.toLowerCase();
  if (!reviewPool.includes(en)) {
    reviewPool.push(en);
    saveReview();
  }
  revealAnswer("🙋 已标记，下次再记", "skip");
  input.disabled = true;
  input.className = "";
  input.value = "";
  saveState();
  updateBar();
  $("nextBtn").classList.remove("hidden");
}

function quitQuiz() {
  saveState();
  goHome();
}

function updateBar() {
  const total = sessionSize || 1;
  const left = queue.length;
  $("bar").style.width = Math.max(0, Math.min(100, (total - left) / total * 100)) + "%";
}

function finish() {
  clearState();
  $("quiz").classList.add("hidden");
  $("done").classList.remove("hidden");
  const acc = totalTries ? Math.round((totalTries - totalWrong) / totalTries * 100) : 100;
  $("doneStats").textContent =
    `本组 ${sessionSize} 词 · 答题 ${totalTries} 次 · 错 ${totalWrong} 次 · 正确率 ${acc}%`;
  $("reviewNote").textContent = reviewPool.length
    ? `待复习池还有 ${reviewPool.length} 个词，下次一组题会优先考它们`
    : "待复习池已清空，太棒了！";
  saveReview();
}

function goHome() {
  $("quiz").classList.add("hidden");
  $("done").classList.add("hidden");
  $("home").classList.remove("hidden");
  refreshHome();
}

function refreshHome() {
  $("totalWords").textContent = WORDS.length;
  $("sessionSizeTxt").textContent = SESSION_SIZE;
  $("reviewLen").textContent = reviewPool.length;
  const s = loadState();
  const btn = $("continueBtn");
  if (s) {
    btn.classList.remove("hidden");
    $("continueTxt").textContent = `剩 ${s.queue.length} 题 · 已答 ${s.tries} 次`;
  } else {
    btn.classList.add("hidden");
  }
}

// 回车提交 / 回车下一题
let lastAction = 0;
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (!$("quiz").classList.contains("hidden")) {
    if (e.target.tagName === "BUTTON") return;
    e.preventDefault();
    if (Date.now() - lastAction < 250) return;
    if (!$("nextBtn").classList.contains("hidden")) {
      next();
      lastAction = Date.now();
    } else {
      submitAnswer();
    }
  }
});

refreshHome();
</script>
